name: Bug report
description: Report a reproducible problem with ShiftLedger.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ShiftLedger. This board is public.

        Do not include earnings amounts, work schedules, payslips, screenshots with personal information, Apple Account details, purchase proof, credentials, or other sensitive data. Use the support email for private help.
  - type: input
    id: app-version
    attributes:
      label: ShiftLedger version
      description: Find it in Settings if available.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: ios-version
    attributes:
      label: iOS version
      placeholder: "iOS 18.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: "iPhone 15"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use generic examples only. Do not enter real work or pay data.
      placeholder: |
        1. Opened ...
        2. Tapped ...
        3. Saw ...
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual result
      placeholder: "Expected ... / Actual ..."
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirm that this public report contains no personal, work, pay, account, or purchase information.
          required: true

